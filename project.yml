name: NamesAndFaces
options:
  bundleIdPrefix: com.wadesellers
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  NamesAndFaces:
    type: application
    platform: iOS
    sources:
      - NamesAndFaces
    dependencies:
      - target: DeckPreview
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wadesellers.NamesAndFaces
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GV76VP4G8V
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # A real Info.plist, because document types are arrays that the
    # INFOPLIST_KEY_ build settings cannot express.
    info:
      path: NamesAndFaces/Info.plist
      properties:
        CFBundleDisplayName: Name That Face
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The camera is used to take a photo of a person for their flashcard.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.wadesellers.namethatface.deck
            UTTypeDescription: Name That Face Deck
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - ntfdeck
        CFBundleDocumentTypes:
          - CFBundleTypeName: Name That Face Deck
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.wadesellers.namethatface.deck
  # Gives a shared deck a real preview in Messages, Mail and Files instead of
  # a generic icon and a file size.
  DeckPreview:
    type: app-extension
    platform: iOS
    sources:
      - path: DeckPreview
      - path: NamesAndFaces/Sharing/DeckFile.swift
      - path: NamesAndFaces/Models/CropRegion.swift
    # Linked explicitly: the system looks up QuickLook's extension context class
    # before any of this target's code runs. Swift only autolinks a framework
    # when a symbol is used, and conforming to QLPreviewingController isn't one,
    # so without this the extension launches, finds no context class, and
    # never creates its view — a blank preview with no crash to point at it.
    dependencies:
      - sdk: QuickLook.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wadesellers.NamesAndFaces.DeckPreview
        # Debug builds otherwise split the binary into a stub plus a
        # .debug.dylib for SwiftUI previews. The stub links only libSystem, so
        # the QuickLook context class the system looks up at launch isn't
        # loaded yet, and the extension never builds its view.
        ENABLE_DEBUG_DYLIB: NO
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GV76VP4G8V
        SKIP_INSTALL: YES
    info:
      path: DeckPreview/Info.plist
      properties:
        CFBundleDisplayName: Deck Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - com.wadesellers.namethatface.deck
            QLSupportsSearchableItems: false

  NamesAndFacesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: NamesAndFaces
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NamesAndFaces:
    build:
      targets:
        NamesAndFaces: all
        NamesAndFacesTests: [test]
    test:
      config: Debug
      targets:
        - NamesAndFacesTests
    run:
      config: Debug
    archive:
      config: Release
