name: NamesAndFaces
options:
  bundleIdPrefix: com.wadesellers
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  NamesAndFaces:
    type: application
    platform: iOS
    sources:
      - NamesAndFaces
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wadesellers.NamesAndFaces
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "1.1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GV76VP4G8V
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # A real Info.plist, because document types are arrays that the
    # INFOPLIST_KEY_ build settings cannot express.
    info:
      path: NamesAndFaces/Info.plist
      properties:
        CFBundleDisplayName: Name That Face
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The camera is used to take a photo of a person for their flashcard.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  NamesAndFacesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: NamesAndFaces
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NamesAndFaces:
    build:
      targets:
        NamesAndFaces: all
        NamesAndFacesTests: [test]
    test:
      config: Debug
      targets:
        - NamesAndFacesTests
    run:
      config: Debug
    archive:
      config: Release
